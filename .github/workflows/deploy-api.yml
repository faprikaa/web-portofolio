name: Deploy API to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy API
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup KV Namespaces
        id: setup-kv
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Check if KV namespace IDs are placeholders
          if grep -q "YOUR_KV_NAMESPACE_ID" wrangler.jsonc; then
            echo "Creating KV namespaces..."
            
            # Create production KV namespace
            PROD_OUTPUT=$(npx wrangler kv namespace create RATE_LIMIT_KV --env production 2>&1)
            PROD_ID=$(echo "$PROD_OUTPUT" | grep -oP 'id = "\K[^"]+' || true)
            
            # Create preview KV namespace
            PREVIEW_OUTPUT=$(npx wrangler kv namespace create RATE_LIMIT_KV --env preview 2>&1)
            PREVIEW_ID=$(echo "$PREVIEW_OUTPUT" | grep -oP 'id = "\K[^"]+' || true)
            
            # If IDs are empty, try alternative parsing
            if [ -z "$PROD_ID" ]; then
              PROD_ID=$(echo "$PROD_OUTPUT" | grep -oP 'namespace-id: \K\w+' || true)
            fi
            if [ -z "$PREVIEW_ID" ]; then
              PREVIEW_ID=$(echo "$PREVIEW_OUTPUT" | grep -oP 'namespace-id: \K\w+' || true)
            fi
            
            echo "Production KV ID: $PROD_ID"
            echo "Preview KV ID: $PREVIEW_ID"
            
            if [ -n "$PROD_ID" ] && [ -n "$PREVIEW_ID" ]; then
              # Update wrangler.jsonc with actual IDs
              sed -i "s/YOUR_KV_NAMESPACE_ID/$PROD_ID/g" wrangler.jsonc
              sed -i "s/YOUR_PREVIEW_KV_NAMESPACE_ID/$PREVIEW_ID/g" wrangler.jsonc
              echo "✅ KV namespaces created and wrangler.jsonc updated"
              echo "prod_id=$PROD_ID" >> $GITHUB_OUTPUT
              echo "preview_id=$PREVIEW_ID" >> $GITHUB_OUTPUT
            else
              echo "❌ Failed to extract KV namespace IDs"
              exit 1
            fi
          else
            echo "✅ KV namespaces already configured"
          fi

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          secrets: |
            GEMINI_API_KEY
            ADMIN_SECRET_KEY
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ADMIN_SECRET_KEY: ${{ secrets.ADMIN_SECRET_KEY }}
