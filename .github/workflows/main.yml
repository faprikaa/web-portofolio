name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "cicd-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  # Job 1: Lint & Type Check
  quality-checks:
    runs-on: ubuntu-latest
    name: Code Quality Checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        run: pnpm --filter @muammar/web lint

      - name: Type check frontend
        run: pnpm --filter @muammar/web tsc --noEmit

      - name: Type check backend
        run: pnpm --filter @muammar/api tsc --noEmit

  # Job 2: Deploy API to Cloudflare Workers
  deploy-api:
    runs-on: ubuntu-latest
    name: Deploy API
    needs: quality-checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup KV Namespaces
        id: setup-kv
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Check if KV namespace IDs are placeholders
          if grep -q "YOUR_KV_NAMESPACE_ID" wrangler.jsonc; then
            echo "⚠️  KV namespaces not configured. Checking for existing namespaces..."
            
            # List existing KV namespaces
            echo "Listing existing KV namespaces..."
            NAMESPACE_LIST=$(npx wrangler kv namespace list 2>&1)
            echo "$NAMESPACE_LIST"
            
            # Extract RATE_LIMIT_KV namespace ID
            PROD_ID=$(echo "$NAMESPACE_LIST" | grep -oP '"title":\s*"RATE_LIMIT_KV".*?"id":\s*"\K[^"]+' || echo "")
            PREVIEW_ID=$(echo "$NAMESPACE_LIST" | grep -oP '"title":\s*"RATE_LIMIT_KV_preview".*?"id":\s*"\K[^"]+' || echo "")
            
            echo "Found Production KV ID: ${PROD_ID:-not found}"
            echo "Found Preview KV ID: ${PREVIEW_ID:-not found}"
            
            # Update wrangler.jsonc if IDs found
            if [ -n "$PROD_ID" ] && [ -n "$PREVIEW_ID" ]; then
              sed -i "s/YOUR_KV_NAMESPACE_ID/$PROD_ID/g" wrangler.jsonc
              sed -i "s/YOUR_PREVIEW_KV_NAMESPACE_ID/$PREVIEW_ID/g" wrangler.jsonc
              echo "✅ wrangler.jsonc updated with existing KV namespace IDs"
              cat wrangler.jsonc
            else
              echo "❌ Could not find existing KV namespaces. Please create them manually:"
              echo "  npx wrangler kv namespace create RATE_LIMIT_KV"
              echo "  npx wrangler kv namespace create RATE_LIMIT_KV --preview"
              exit 1
            fi
          else
            echo "✅ KV namespaces already configured in wrangler.jsonc"
          fi

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          secrets: |
            GEMINI_API_KEY
            ADMIN_SECRET_KEY
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ADMIN_SECRET_KEY: ${{ secrets.ADMIN_SECRET_KEY }}

  # Job 3: Deploy Web to Cloudflare Pages
  deploy-web:
    runs-on: ubuntu-latest
    name: Deploy Web
    needs: deploy-api
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**.[jt]s', 'apps/web/**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Build with OpenNext
        run: pnpm --filter @muammar/web build:worker
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: pages deploy .open-next/assets --project-name=muammar
